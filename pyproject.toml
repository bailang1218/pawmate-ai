[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pawmate-ai"
version = "0.1.0a1"
description = "Windows-first desktop AI assistant with a desktop pet, multi-provider LLM routing, tools, memory, and Web/Qt UI."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [
  { name = "PawMate AI contributors" }
]
keywords = ["desktop-ai", "pyside6", "llm", "agent", "desktop-pet", "browser-automation"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Operating System :: Microsoft :: Windows",
  "Topic :: Desktop Environment",
]
dependencies = [
  "PySide6>=6.7,<7",
  "httpx>=0.27,<1",
  "aiohttp>=3.9,<4",
  "websockets>=16,<17",
  "APScheduler>=3.10,<4",
  "SQLAlchemy>=1.4,<3",
  "Pillow>=12.2,<13",
  "numpy>=1.26,<3",
  "psutil>=5.9",
  "playwright>=1.45,<2",
  "openai>=2.44,<3",
  "anthropic>=0.34,<1",
  "mcp>=1.9,<2",
  "PyYAML>=6,<7",
  "pywin32>=306; platform_system == 'Windows'",
  "tzdata>=2024.1; platform_system == 'Windows'",
]

[project.optional-dependencies]
dev = [
  "pytest>=9.1,<10",
  "pytest-asyncio>=0.23,<2",
  "import-linter>=2.1,<3",
]

[project.urls]
Homepage = "https://github.com/bailang1218/pawmate-ai"
Issues = "https://github.com/bailang1218/pawmate-ai/issues"

[project.scripts]
pawmate = "pawmate.main:main"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["pawmate*"]

[tool.setuptools.package-data]
pawmate = [
  "config.json.example",
  "ui/web/**/*",
  "skills/builtin/**/*",
  "desktop_pet/README.md",
  "desktop_pet/assets/**/*",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
